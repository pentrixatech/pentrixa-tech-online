<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" role="img" aria-label="Pentrixa Tech Emblem">
  <defs>
    <!-- Webfont embed -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&amp;display=swap');
      .icon-monogram {
        font-family: 'Playfair Display', Georgia, serif;
        font-weight: 700;
        font-size: 28px;
        fill: #F4F1EC;
        letter-spacing: -0.02em;
      }
    </style>

    <!-- Warm Rose-Bronze Rim Gradient -->
    <linearGradient id="roseBronzeGradient" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#E8DAD5" />
      <stop offset="50%" stop-color="#C9A3A0" />
      <stop offset="100%" stop-color="#8C4A50" />
    </linearGradient>

    <!-- Clean Optical Core Gradient -->
    <radialGradient id="mastheadCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#23171B" />
      <stop offset="100%" stop-color="#101217" />
    </radialGradient>
  </defs>

  <!-- Outer Diamond Chassis (Deep Obsidian with Rose-Bronze Hairline) -->
  <polygon points="50,6 94,50 50,94 6,50" 
           stroke="url(#roseBronzeGradient)" 
           stroke-width="2" 
           stroke-linejoin="round" 
           fill="url(#mastheadCore)" />

  <!-- Middle Architectural Drafting Ring (Warm Burgundy Dash-Line) -->
  <polygon points="50,18 82,50 50,82 18,50" 
           stroke="#A34E54" 
           stroke-width="1.2" 
           stroke-dasharray="3, 2"
           stroke-linejoin="round" 
           fill="none" 
           opacity="0.75" />

  <!-- Inner Vault Frame (Subtle Warm Elevation) -->
  <polygon points="50,28.5 71.5,50 50,71.5 28.5,50" 
           stroke="#C9A3A0" 
           stroke-width="1.2" 
           stroke-linejoin="round" 
           fill="#161920" />

  <!-- Corner Alignment Pips (Human-Drafted Architectural Detail) -->
  <circle cx="50" cy="18" r="1.5" fill="#E8DAD5" />
  <circle cx="82" cy="50" r="1.5" fill="#C9A3A0" />
  <circle cx="50" cy="82" r="1.5" fill="#E8DAD5" />
  <circle cx="18" cy="50" r="1.5" fill="#C9A3A0" />

  <!-- Optically Centered Monogram "P" -->
  <text x="50" y="50.5" 
        class="icon-monogram" 
        text-anchor="middle" 
        dominant-baseline="central">P</text>
</svg>
