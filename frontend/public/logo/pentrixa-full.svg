<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 80" width="100%" height="100%" role="img" aria-label="Pentrixa Tech Logo">
  <defs>
    <!-- Webfont embed matching Concept 1 typography -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&amp;family=Playfair+Display:wght@700&amp;family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap');
      
      .brand-title {
        font-family: 'Playfair Display', Georgia, serif;
        font-weight: 700;
        letter-spacing: 0.08em;
        fill: #F4F1EC;
      }
      .brand-sub {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 500;
        letter-spacing: 0.16em;
        fill: #C9A3A0;
      }
      .brand-tagline {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 600;
        font-size: 7.25px;
        letter-spacing: 0.28em;
        fill: #9FA6B2;
      }
      .monogram {
        font-family: 'Playfair Display', Georgia, serif;
        font-weight: 700;
        font-size: 20px;
        fill: #F4F1EC;
      }
    </style>

    <!-- Warm Rose-Bronze Linear Gradient -->
    <linearGradient id="logoRoseBronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8DAD5" />
      <stop offset="50%" stop-color="#C9A3A0" />
      <stop offset="100%" stop-color="#8C4A50" />
    </linearGradient>

    <!-- Deep Vault Radial Core -->
    <radialGradient id="emblemVault" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#23171B" />
      <stop offset="100%" stop-color="#101217" />
    </radialGradient>
  </defs>

  <!-- Left Geometric Emblem Structure -->
  <g transform="translate(10, 5)">
    <!-- Outer Diamond Chassis (Obsidian fill + Rose-Bronze hairline) -->
    <polygon points="35,4 66,35 35,66 4,35" 
             stroke="url(#logoRoseBronze)" 
             stroke-width="1.8" 
             stroke-linejoin="round" 
             fill="url(#emblemVault)" />

    <!-- Middle Architectural Drafting Ring (Burgundy Dashed Guide) -->
    <polygon points="35,12.5 57.5,35 35,57.5 12.5,35" 
             stroke="#A34E54" 
             stroke-width="1.1" 
             stroke-dasharray="2.5, 1.8"
             stroke-linejoin="round" 
             fill="none" 
             opacity="0.8" />

    <!-- Inner Vault Core -->
    <polygon points="35,20 50,35 35,50 20,35" 
             stroke="#C9A3A0" 
             stroke-width="1" 
             stroke-linejoin="round" 
             fill="#161920" />

    <!-- Alignment Precision Pips -->
    <circle cx="35" cy="12.5" r="1.1" fill="#E8DAD5" />
    <circle cx="57.5" cy="35" r="1.1" fill="#C9A3A0" />
    <circle cx="35" cy="57.5" r="1.1" fill="#E8DAD5" />
    <circle cx="12.5" cy="35" r="1.1" fill="#C9A3A0" />

    <!-- Centered Monogram "P" -->
    <text x="35" y="35.5" class="monogram" text-anchor="middle" dominant-baseline="central">P</text>
  </g>

  <!-- Wordmark & Suffix -->
  <text x="94" y="39">
    <tspan class="brand-title" font-size="23">PENTRIXA</tspan>
    <tspan dx="8" class="brand-sub" font-size="14">TECH</tspan>
  </text>

  <!-- Studio Subline Tag -->
  <text x="95" y="57" class="brand-tagline">BUILD. INNOVATE. SCALE.</text>
</svg>
